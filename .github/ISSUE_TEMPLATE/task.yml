name: 🛠️ Task
description: Something to build, buy, fix, or do
title: "[Task] "
labels: ["task"]
body:
  - type: dropdown
    id: subteam
    attributes:
      label: Sub-team
      options: [Mechanical, Programming, Electrical, Business / Media, Strategy / Scouting, Whole team]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs to happen?
      placeholder: "Make 4 new turret spacer plates from the updated CAD."
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How do we know it's done?
      placeholder: "- [ ] Plates cut\n- [ ] Test-fit on robot\n- [ ] CAD updated"
  - type: input
    id: due
    attributes:
      label: Needed by
      placeholder: "Before Feb 20 practice"
