name: 📘 Handbook request / fix
description: Something in the handbook is missing, wrong, or confusing
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Which page? (or "new page")
  - type: textarea
    id: what
    attributes:
      label: What's missing or wrong?
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Want to write it?
      options:
        - label: I can write this myself (a lead will help review)
