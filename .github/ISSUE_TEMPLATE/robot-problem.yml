name: 🐛 Robot problem
description: Something on the robot (or code) is broken or acting weird
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Drivetrain, Shooter / Turret, Intake, Vision, Electrical, Code, Other]
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: What happened?
      description: What you saw, when, and what the robot was doing.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
  - type: textarea
    id: evidence
    attributes:
      label: Logs, photos, video
      description: Drag files here. No photos of students' faces without coach approval.
  - type: markdown
    attributes:
      value: "Once it's fixed, add the fix to [Troubleshooting](https://github.com/PCDSBlueTide/2840-brain/blob/master/handbook/troubleshooting.md) 🙏"
